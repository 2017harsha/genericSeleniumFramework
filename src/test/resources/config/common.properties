# ------------------------------------------------------------------
# Defaults shared by every environment. <env>.properties overrides these,
# and -Dkey=value / environment variables override both.
# ------------------------------------------------------------------
browser=chrome
headless=true
# Selenium Grid hub, e.g. http://localhost:4444 . Empty = run browsers locally.
gridUrl=

# Timeouts (seconds)
timeout.explicit=15
timeout.pageLoad=60
timeout.script=30

# NORMAL | EAGER | NONE  (EAGER helps on ad-heavy pages)
page.load.strategy=EAGER
window.size=1920,1080

# Retries after the first run: 2 => up to 3 attempts. Failure evidence is saved only if all attempts fail.
retry.count=2

# Region used for AWS Parameter Store lookups (ssm:... values)
aws.region=ap-south-1

# PROD environment
app.url=https://selectorshub.com/xpath-practice-page/
# Secrets are NOT stored here. "ssm:" values are pulled from AWS Systems Manager
# Parameter Store (SecureString, decrypted) at runtime by AwsParameterStore.
app.username=ssm:/selenium-framework/prod/app.username
app.password=ssm:/selenium-framework/prod/app.password
